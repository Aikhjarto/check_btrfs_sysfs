[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "check_btrfs_sysfs"
dynamic = ["version"]
description = "Nagios/Naemon/Icinga plugin for btrfs space and device errors, without root"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Thomas Wagner", email = "wagner-thomas@gmx.at" }]
requires-python = ">=3.7"
dependencies = []
keywords = ["btrfs", "nagios", "naemon", "icinga", "monitoring", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
]

[project.scripts]
check_btrfs_sysfs = "check_btrfs_sysfs:main"

[tool.setuptools]
py-modules = ["check_btrfs_sysfs"]

[tool.setuptools.dynamic]
version = { attr = "check_btrfs_sysfs.__version__" }
